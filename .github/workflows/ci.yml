name: CI

# Nothing used to build or test before a merge; the release tag was the first time any
# code was compiled. This runs on every change instead.
on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: it is the only leg that runs the test suite
        # against net48, and therefore the only one that exercises the netstandard2.0
        # assembly .NET Framework consumers actually get from the package. It also runs
        # under NLS rather than ICU, which formats numbers differently from Linux.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/NumWordify.Tests/NumWordify.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack (verifies package validation and metadata)
        run: dotnet pack NumWordify.csproj -c Release --no-build -o out
