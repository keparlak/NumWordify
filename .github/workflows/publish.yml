name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires an environment named "nuget", so publishing can be gated on a reviewer
    # rather than on whoever can push a tag. The trusted publishing policy on nuget.org
    # names this environment too, so a run outside it cannot obtain a key.
    environment: nuget

    permissions:
      contents: read
      # Lets the job request a signed OIDC token from GitHub. This is what replaces the
      # stored API key: nuget.org validates the token against a trusted publishing policy
      # and hands back a key that lives one hour.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      # The version used to be hardcoded in the csproj, so every tag produced the same
      # package and --skip-duplicate swallowed the push while the job stayed green.
      # NuGet drops SemVer build metadata from the package file name, so "+build" would
      # make the verification step below look for a file that can never exist.
      - name: Derive package version from tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*)
              ;;
            *)
              echo "::error::Tag '$GITHUB_REF_NAME' must be of the form v<version>, e.g. v2.0.0."
              exit 1
              ;;
          esac

          case "$GITHUB_REF_NAME" in
            *+*)
              echo "::error::Tag '$GITHUB_REF_NAME' carries SemVer build metadata, which NuGet strips from the package file name. Tag without it."
              exit 1
              ;;
          esac

          echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version="$PKG_VERSION"

      - name: Test
        run: dotnet test tests/NumWordify.Tests/NumWordify.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack NumWordify.csproj -c Release --no-build -p:Version="$PKG_VERSION" -o out

      - name: Verify the package carries the tagged version
        run: |
          expected="out/NumWordify.${PKG_VERSION}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "::error::Expected $expected. Produced: $(ls out)"
            exit 1
          fi

      # Trusted Publishing. Requested here rather than earlier in the job because the key
      # nuget.org issues is valid for one hour, and a token can be exchanged exactly once.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name that owns the package — not an email address.
          user: keparlak

      # No --skip-duplicate: re-publishing an existing version is a mistake worth failing on.
      - name: Push to NuGet
        run: |
          dotnet nuget push "out/NumWordify.${PKG_VERSION}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
